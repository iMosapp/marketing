crons:
  - name: lt-morning-brief
    description: "Hourly check that pushes the Chief of Staff morning brief at the founder's chosen local hour"
    cron: "5 * * * *"
    endpoint: "{{BASE_URL}}/api/cron/leadership-morning-brief"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: pilot-reminders
    description: "Daily Founding Partner Pilot check: founder reminders at pilot days 30 / 60 / 75 / 90 (once each), finished pilots marked completed; never charges or converts anyone"
    cron: "0 15 * * *"
    endpoint: "{{BASE_URL}}/api/cron/pilot-reminders"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
